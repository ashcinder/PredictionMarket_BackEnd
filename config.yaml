chain:
  private_key: "0f7597919f8d6442707e93d2723adca206e9090623914942bf876bd6b4f5e5c9"
  contract_address: "0xda550FdB040A10ff1f5467042aE3E7E13DF43F7F"
  rpc_url: "http://127.0.0.1:42515"
  broker_chain_url: "http://127.0.0.1:56741/"
  use_broker_chain: false

server:
  http_listen: ":8081"

ipfs:
  # 本地模拟器上传的 local-v1 CID 由本服务的本地内容接口读取。
  gateway: "http://127.0.0.1:8081/api/v1/ipfs/"
  # 真实 Kubo/IPFS CID 会继续回退到本地网关。
  fallback_gateways:
    - "http://127.0.0.1:8083/ipfs/"

oracle:
  gold_api_url: "https://api.gold-api.com/price/XAU"
  # 历史 OHLC/价格序列用于确定性裁决。API key 推荐通过
  # PREDICTIONMARKET_GOLD_API_KEY 环境变量注入，不要提交真实密钥。
  historical_base_url: "https://api.gold-api.com"
  historical_api_key: ""
  # BTC-USD 一分钟历史 K 线，用于“黄金跑赢 BTC”等短周期相对收益市场。
  bitcoin_historical_base_url: "https://api.exchange.coinbase.com"
  # Chainlink 主网公开 RPC 依次容灾；无需 Data Streams 付费账号。
  chainlink_rpc_urls:
    - "https://1rpc.io/eth"
    - "https://rpc.mevblocker.io"
    - "https://eth-mainnet.public.blastapi.io"
    - "https://rpc.eth.gateway.fm"
    - "https://eth-pokt.nodies.app"
  # Ethereum 主网 XAU/USD 与 BTC/USD Data Feed 合约。
  chainlink_xau_usd_feed: "0x214eD9Da11D2fbe465a6fc601a91E62EbEc1a0D6"
  chainlink_btc_usd_feed: "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c"
  # 记录最新轮次的间隔，以及边界价格允许的最大陈旧时间。
  chainlink_poll_interval_seconds: 60
  chainlink_max_staleness_seconds: 43200
  # 每隔多少秒保存一次实时 XAU/USD；短周期价格与跑赢率市场可用这些采样复算。
  sample_interval_seconds: 10
  sina_url: "https://hq.sinajs.cn/list=hf_XAU"
  sina_referer: "https://finance.sina.com.cn"
  user_agent: "PredictionMarket/1.0"
  request_timeout_seconds: 10

sentinel:
  poll_interval_seconds: 30
  resolve_delay_seconds: 5

sampler:
  # 是否定时从链上读取池状态并回写 MySQL；本地 DB-only 测试建议关闭，避免覆盖模拟数据。
  chain_sync_enabled: true
  poll_interval_seconds: 60

ai:
  api_key: "sk-679c615e26234c67b00677ba689a80d8"
  # sk-679c615e26234c67b00677ba689a80d8
  # sk-b8da86ece249461b970cb803c5a655b6
  base_url: "https://api.deepseek.com/chat/completions"
  model: "deepseek-chat"
  poll_interval_seconds: 60
  buy_amount_bkc: "1"
  confidence_min: 0.70
  history_min_points: 3
  history_max_points: 256
  kelly_fraction: 0.25 # Use 1/4 Kelly for safety (0.25 = quarter-Kelly)
  min_edge_percent: 5.0 # Minimum 5% edge vs market price to trade
  max_position_per_market_bkc: "50" # Max total position per market
  adaptive_cooldown: true # Use adaptive cooldown based on market conditions

# ---------------------------------------------------------------------------
# AI Oracle — N-1 models independently review evidence, then the named Nth
# model receives every opinion and makes the final YES/NO/INDETERMINATE ruling.
#
# This is OPTIONAL: remove or comment out the entire aioracle section to
# disable the AI oracle. The server will start without it.
# ---------------------------------------------------------------------------
aioracle:
  poll_interval_seconds: 300 # How often to re-evaluate pending events (5 min)

  consensus:
    final_arbiter: "minimax" # Nth model; all other configured models are independent reviewers
    min_consensus_ratio: 0.66 # Legacy mode only; ignored when final_arbiter is set
    min_confidence: 0.60 # Legacy mode only; ignored when final_arbiter is set
    min_models_required: 3 # Legacy mode only; retained for backward-compatible configs

  news:
    # news_api_key: "your-newsapi-key"  # https://newsapi.org/ (optional)
    # news_api_url: "https://newsapi.org/v2/everything"
    rss_feeds:
      - "https://cointelegraph.com/rss"
      - "https://feeds.bbci.co.uk/news/business/rss.xml"
    max_articles: 10
    lookback_hours: 72
    request_timeout_seconds: 30

  providers:
    - name: "deepseek"
      model: "deepseek-chat"
      api_key: "sk-679c615e26234c67b00677ba689a80d8"
      # sk-679c615e26234c67b00677ba689a80d8
      # sk-b8da86ece249461b970cb803c5a655b6
      base_url: "https://api.deepseek.com/chat/completions"
      provider: "deepseek"
      weight: 1.0
      timeout_seconds: 60

    - name: "glm"
      model: "glm-4-flash"
      api_key: "cb837d424cbd4bf2be3a4fe7f487794f.MvN2RDhIpvp2hDy9"
      base_url: "https://open.bigmodel.cn/api/paas/v4/chat/completions"
      provider: "glm"
      weight: 1.0
      timeout_seconds: 60

    - name: "minimax"
      model: "MiniMax-M2.7"
      api_key: "sk-api-52QjmJKF90woB5oGvkFAdVHuahtwS3D8qyVu6dQD9UsRZMlld3eQIuiLfPWG8YolKZcV6oDc7961eqtYWe-P-4opM5HVQH-4D40BI5vZgdMsvCxhSAAHR3Q"
      base_url: "https://api.minimaxi.com/v1/chat/completions"
      provider: "minimax"
      weight: 1.0
      timeout_seconds: 60

mysql:
  dsn: "root:12345678@tcp(127.0.0.1:3306)/predictionmarket_cn?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_connections: 100
  max_idle_connections: 10
  connection_max_lifetime_seconds: 300
