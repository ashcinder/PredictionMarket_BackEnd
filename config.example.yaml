chain:
  private_key: "replace-with-wallet-private-key"
  contract_address: "0xda550FdB040A10ff1f5467042aE3E7E13DF43F7F"
  # Supervisor 的本地 Ethereum JSON-RPC；Android 模拟器侧对应 10.0.2.2:42515。
  rpc_url: "http://127.0.0.1:42515"
  broker_chain_url: "http://127.0.0.1:56741/"
  use_broker_chain: false

server:
  http_listen: ":8081"

mysql:
  dsn: "root:replace-with-mysql-password@tcp(127.0.0.1:3306)/predictionmarket_cn?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_connections: 100
  max_idle_connections: 10
  connection_max_lifetime_seconds: 300

ipfs:
  # 本地模拟器上传的 local-v1 CID 由本服务的本地内容接口读取。
  gateway: "http://127.0.0.1:8081/api/v1/ipfs/"
  # 真实 Kubo/IPFS CID 可回退到本地网关读取。
  fallback_gateways:
    - "http://127.0.0.1:8083/ipfs/"

oracle:
  gold_api_url: "https://api.gold-api.com/price/XAU"
  # 历史 OHLC/价格序列 API；密钥推荐通过 PREDICTIONMARKET_GOLD_API_KEY 注入。
  historical_base_url: "https://api.gold-api.com"
  historical_api_key: ""
  # Coinbase Exchange 公共 BTC-USD 一分钟 K 线，无需 API key。
  bitcoin_historical_base_url: "https://api.exchange.coinbase.com"
  # Chainlink 公开以太坊 RPC，前一个不可用时自动切换。
  chainlink_rpc_urls:
    - "https://1rpc.io/eth"
    - "https://rpc.mevblocker.io"
    - "https://eth-mainnet.public.blastapi.io"
    - "https://rpc.eth.gateway.fm"
    - "https://eth-pokt.nodies.app"
  # Ethereum 主网 XAU/USD 与可选跑赢率标的 Data Feed。
  chainlink_xau_usd_feed: "0x214eD9Da11D2fbe465a6fc601a91E62EbEc1a0D6"
  chainlink_btc_usd_feed: "0xF4030086522a5bEEa4988F8cA5B36dbC97BeE88c"
  chainlink_eth_usd_feed: "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419"
  chainlink_sol_usd_feed: "0x4ffC43a60e009B551865A93d232E33Fce9f01507"
  chainlink_bnb_usd_feed: "0x14e613AC84a31f709eadbdF89C6CC390fDc9540A"
  # 轮次缓存周期与边界价格最大陈旧时间。
  chainlink_poll_interval_seconds: 60
  chainlink_max_staleness_seconds: 43200
  # 本地 XAU/USD 采样间隔；后端必须在博弈池开始前运行，才能覆盖完整时间窗。
  sample_interval_seconds: 10
  sina_url: "https://hq.sinajs.cn/list=hf_XAU"
  sina_referer: "https://finance.sina.com.cn"
  user_agent: "PredictionMarket/1.0"
  request_timeout_seconds: 10

sentinel:
  # false: stop automatic settlement scans and enable immediate-expiry demo market creation.
  auto_resolve_enabled: true
  poll_interval_seconds: 30
  resolve_delay_seconds: 5

sampler:
  # true 时以链上池列表为准同步并清理 MySQL 中未上链的测试池；本地 DB-only 测试建议关闭。
  chain_sync_enabled: false
  poll_interval_seconds: 60

ai:
  api_key: "replace-with-ai-api-key"
  base_url: "https://api.deepseek.com/chat/completions"
  model: "deepseek-chat"
  poll_interval_seconds: 60
  buy_amount_bkc: "1"
  confidence_min: 0.70
  history_min_points: 3
  history_max_points: 256
  kelly_fraction: 0.25
  min_edge_percent: 5.0
  max_position_per_market_bkc: "50"
  adaptive_cooldown: true

